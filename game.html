<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что бы ты выбрала?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Comfortaa:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Одна карточка-вопрос по центру, два больших варианта, под ними счёт и тема */
:root {
  --bg: #fdf1f4;
  --paper: #fffafb;
  --blush: #f8d7e0;
  --rose: #e98aa6;
  --berry: #b8486c;
  --ink: #5a3442;
  --muted: #9a7280;
  --line: #f1c6d3;
  --match: #4f9a7a;
  --display: "Marck Script", "Segoe Script", cursive;
  --body: "Comfortaa", "Nunito", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 22px; }
a { color: var(--berry); }
h1 { font-family: var(--display); font-weight: 400; color: var(--berry); font-size: clamp(2.6rem, 10vw, 3.6rem); line-height: 1.1; margin: 0; text-align: center; text-wrap: balance; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: center; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }
.btn { border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 700; background: var(--berry); color: var(--paper); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--blush); color: var(--berry); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.who { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 24px clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px -32px var(--berry); }
.topic-label { font-size: .8rem; color: var(--muted); text-align: center; }
.options { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.or { align-self: center; font-family: var(--display); font-size: 1.6rem; color: var(--rose); }
.opt { position: relative; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 18px; padding: 22px 14px 40px; font-weight: 700; font-size: 1.02rem; min-height: 130px; display: flex; align-items: center; justify-content: center; text-align: center; transition: transform .15s, border-color .2s, background .2s; min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--rose); }
.opt:disabled { cursor: default; }
.opt.mine { border-color: var(--berry); background: var(--blush); }
.opt .tags { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 6px; justify-content: center; }
.tag { font-size: .72rem; padding: 2px 10px; border-radius: 999px; background: var(--berry); color: var(--paper); font-weight: 700; }
.tag.z { background: var(--rose); }
.status { text-align: center; min-height: 1.6em; color: var(--muted); font-weight: 600; }
.result { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.result b { font-family: var(--display); font-weight: 400; font-size: 2rem; color: var(--berry); }
.result b.ok { color: var(--match); }
.comment { font-size: .95rem; }

.controls { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--berry); color: var(--paper); border-color: var(--berry); }
.custom { display: flex; gap: 8px; }
.custom input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; background: var(--paper); color: var(--ink); }
.score { text-align: center; font-family: var(--mono); color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.score strong { color: var(--berry); }
.error { color: var(--berry); text-align: center; font-size: .9rem; min-height: 1.4em; }
.thinking::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; text-align: left; overflow: hidden; vertical-align: bottom; }
@keyframes dots { 0% { width: 0; } 100% { width: 1.2em; } }
.burst { position: fixed; pointer-events: none; z-index: 5; color: var(--rose); font-size: 22px; animation: fly 1.4s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }

@media (max-width: 480px) {
  .options { grid-template-columns: 1fr; }
  .or { justify-self: center; }
  .opt { min-height: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="./">← на главную</a>
    <span id="meLabel"></span>
  </div>
  <p class="eyebrow">Игра на двоих · Киев ↔ Львов</p>
  <h1>Что бы ты выбрала?</h1>

  <section class="card" id="pick" hidden>
    <p style="text-align:center; margin:0">Кто играет на этом телефоне?</p>
    <div class="who">
      <button class="btn" data-me="vanya">Я Ваня</button>
      <button class="btn" data-me="zlata">Я Злата</button>
    </div>
  </section>

  <section class="card" id="game" hidden>
    <p class="topic-label" id="topic"></p>
    <div class="options">
      <button class="opt" id="optA" data-c="a"><span class="txt"></span><span class="tags"></span></button>
      <span class="or">или</span>
      <button class="opt" id="optB" data-c="b"><span class="txt"></span><span class="tags"></span></button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="result" id="result" hidden>
      <b id="verdict"></b>
      <p class="comment" id="comment"></p>
    </div>
  </section>

  <section class="controls" id="controls" hidden>
    <div class="chips" id="chips" role="group" aria-label="Тема вопроса"></div>
    <form class="custom" id="customForm">
      <label for="custom" hidden>Своя тема</label>
      <input id="custom" maxlength="80" placeholder="Своя тема для ИИ, например «зима»">
    </form>
    <div style="display:flex; justify-content:center">
      <button class="btn" id="next">Новый вопрос ✨</button>
    </div>
    <p class="error" id="error" aria-live="polite"></p>
    <p class="score" id="score"></p>
  </section>
</main>

<script>
const API = "/api/room";
const ROOM = new URLSearchParams(location.search).get("room") || "vanya-zlata";
const NAMES = { vanya: "Ваня", zlata: "Злата" };
const TOPICS = [
  ["cute", "Милое"], ["romance", "Романтика"], ["travel", "Свидания"], ["food", "Еда"],
  ["future", "Будущее"], ["funny", "Смешное"], ["spicy", "Пикантное 🔥"], ["english", "English & IT"]
];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let me = store.get("wyr-me");
let topic = store.get("wyr-topic") || "cute";
let state = null, busy = false, lastRevealRound = 0, timer = null;

function burst(n = 24) {
  if (reduce) return;
  const x = innerWidth / 2, y = innerHeight / 2;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "burst"; s.textContent = "♥";
    s.style.left = x + "px"; s.style.top = y + "px";
    const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 140;
    s.style.setProperty("--dx", Math.cos(a) * r + "px");
    s.style.setProperty("--dy", Math.sin(a) * r + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }
}

async function api(method, body) {
  const url = `${API}?room=${encodeURIComponent(ROOM)}` + (method === "GET" ? `&me=${me}` : "");
  const res = await fetch(url, method === "GET" ? {} : {
    method, headers: { "content-type": "application/json" }, body: JSON.stringify({ ...body, me })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Сервер не отвечает. Попробуй ещё раз");
  return data;
}

function render() {
  const partner = me === "vanya" ? "zlata" : "vanya";
  $("meLabel").textContent = `Ты играешь за ${NAMES[me]} · `;
  const sw = document.createElement("button");
  sw.textContent = "сменить"; sw.className = "chip"; sw.style.padding = "2px 10px";
  sw.onclick = () => { me = null; store.set("wyr-me", ""); start(); };
  $("meLabel").appendChild(sw);

  $("game").hidden = false; $("controls").hidden = false;
  const s = state;
  const sc = s.score || { matches: 0, total: 0 };
  $("score").innerHTML = `совпадений <strong>${sc.matches}</strong> из ${sc.total}`;

  if (!s.question) {
    $("topic").textContent = "";
    for (const id of ["optA", "optB"]) { $(id).hidden = true; }
    document.querySelector(".or").hidden = true;
    $("status").textContent = "Выбери тему и нажми «Новый вопрос». Он появится у вас обоих.";
    $("result").hidden = true;
    return;
  }
  document.querySelector(".or").hidden = false;
  $("topic").textContent = `Раунд ${s.round} · ${s.question.topic}${s.question.ai ? " · придумал ИИ" : ""}`;

  for (const [id, c] of [["optA", "a"], ["optB", "b"]]) {
    const el = $(id);
    el.hidden = false;
    el.querySelector(".txt").textContent = s.question[c];
    el.disabled = Boolean(s.mine);
    el.classList.toggle("mine", s.mine === c);
    const tags = el.querySelector(".tags");
    tags.innerHTML = "";
    if (s.reveal) {
      if (s.reveal.vanya === c) tags.insertAdjacentHTML("beforeend", `<span class="tag">Ваня</span>`);
      if (s.reveal.zlata === c) tags.insertAdjacentHTML("beforeend", `<span class="tag z">Злата</span>`);
    } else if (s.mine === c) {
      tags.insertAdjacentHTML("beforeend", `<span class="tag${me === "zlata" ? " z" : ""}">ты</span>`);
    }
  }

  if (s.reveal) {
    const same = s.reveal.vanya === s.reveal.zlata;
    $("status").textContent = "";
    $("result").hidden = false;
    $("verdict").textContent = same ? "Совпали! 💗" : "Разные ответы";
    $("verdict").className = same ? "ok" : "";
    $("comment").textContent = s.comment || "";
    if (same && lastRevealRound !== s.round && lastRevealRound !== 0) burst();
    lastRevealRound = s.round;
  } else {
    $("result").hidden = true;
    if (lastRevealRound === 0) lastRevealRound = -1;
    $("status").textContent = s.mine
      ? (s.partnerChose ? "Открываем ответы…" : `Ждём, что выберет ${NAMES[partner]}…`)
      : (s.partnerChose ? `${NAMES[partner]} уже выбрал${partner === "zlata" ? "а" : ""}. Твоя очередь!` : "Выбирай! Ответ откроется, когда выберете оба");
  }
}

async function refresh() {
  try {
    state = await api("GET");
    $("error").textContent = "";
    render();
  } catch (e) {
    $("error").textContent = e.message;
  }
}

async function choose(c) {
  if (busy || !state?.question || state.mine) return;
  busy = true;
  state.mine = c; render();
  try {
    state = await api("POST", { action: "choose", round: state.round, choice: c });
    render();
  } catch (e) {
    $("error").textContent = e.message;
    await refresh();
  } finally { busy = false; }
}

async function nextQuestion() {
  if (busy) return;
  busy = true;
  const btn = $("next");
  btn.disabled = true;
  btn.innerHTML = `<span class="thinking">ИИ придумывает</span>`;
  try {
    state = await api("POST", { action: "next", topic, custom: $("custom").value, fromRound: state?.round ?? 0 });
    $("custom").value = "";
    $("error").textContent = "";
    render();
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    busy = false; btn.disabled = false; btn.textContent = "Новый вопрос ✨";
  }
}

function buildChips() {
  const wrap = $("chips");
  wrap.innerHTML = "";
  for (const [key, label] of TOPICS) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", String(key === topic));
    b.onclick = () => { topic = key; store.set("wyr-topic", key); buildChips(); };
    wrap.appendChild(b);
  }
}

function start() {
  clearInterval(timer);
  if (!me || !NAMES[me]) {
    $("pick").hidden = false; $("game").hidden = true; $("controls").hidden = true; $("meLabel").textContent = "";
    return;
  }
  $("pick").hidden = true;
  refresh();
  timer = setInterval(() => { if (!busy && document.visibilityState === "visible") refresh(); }, 2000);
}

document.querySelectorAll("[data-me]").forEach(b => b.onclick = () => { me = b.dataset.me; store.set("wyr-me", me); start(); });
$("optA").onclick = () => choose("a");
$("optB").onclick = () => choose("b");
$("next").onclick = nextQuestion;
$("customForm").onsubmit = e => { e.preventDefault(); nextQuestion(); };
buildChips();
start();
</script>
</body>
</html>
